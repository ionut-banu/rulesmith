{% extends "base.html" %}

{% block title %}{{ "Edit rule" if rule else "New rule" }} - {{ dataset.name }} - Rulesmith{% endblock %}

{% block content %}
    <h2>{{ "Edit rule" if rule else "New rule" }}</h2>
    <p><a href="/datasets/{{ dataset.id }}">Back to {{ dataset.name }}</a></p>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post" action="{{ action }}">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" value="{{ name or '' }}">

        <label for="expression">Expression</label>
        <textarea id="expression" name="expression">{{ expression or '' }}</textarea>

        <button type="submit">{{ "Save rule" if rule else "Create rule" }}</button>
    </form>
{% endblock %}
