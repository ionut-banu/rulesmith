[project]
name = "rulesmith"
version = "0.1.0"
description = "Data quality rule builder"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "pandas>=3.0.5",
    "simpleeval>=1.0.7",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
