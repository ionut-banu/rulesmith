# Local development stack. The Postgres credentials below are dev-only
# placeholders; deployed environments get their credentials elsewhere.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rulesmith
      POSTGRES_PASSWORD: rulesmith-dev-only
      POSTGRES_DB: rulesmith
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rulesmith -d rulesmith"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      RULESMITH_DATABASE_URL: postgresql+psycopg://rulesmith:rulesmith-dev-only@db:5432/rulesmith
      RULESMITH_UPLOAD_DIR: /var/lib/rulesmith/uploads
      # Telemetry is off unless the endpoint is set in your shell, e.g.
      # OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4318 make up
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      RULESMITH_ENV: ${RULESMITH_ENV:-}
      RULESMITH_VERSION: ${RULESMITH_VERSION:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - uploads:/var/lib/rulesmith/uploads

volumes:
  pgdata:
  uploads:
